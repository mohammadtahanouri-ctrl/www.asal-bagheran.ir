const CATS={
honey:{n:'عسل طبیعی',e:'🍯',u:'کیلوگرم',b:650000,pre:'h',

 t:'برای صبحانه، شیرینی‌پزی و غذاهای سنتی مناسب است. در جای خنک نگهداری شود.',
 f:['مغذی و پرانرژی','مناسب صبحانه','طعم اصیل سنتی'],
 i:'ارده|کره بادام‌زمینی|ارده شکلاتی|شیره انگور|شیره خرما|سه شیره|چهار شیره|پنج شیره|رب انار'},

 t:'عرق گیاهی برای مصرف روزانه عرضه می‌شود. در جای خنک و دور از نور نگهداری شود.',
 f:['گیاهی و سنتی','مناسب مصرف روزانه','عطر و طعم طبیعی'],

const P=[];

 if(k=='honey'&&!/^(مخلوط|ژل|گرده|معجون)/.test(n))n='عسل '+n;
 if(k=='arq')n='عرق '+n;
 let s=0;for(const ch of n)s+=ch.charCodeAt(0);
 let p=C.b+(s%9)*25000;if(/زعفران|ژل|بره|سنجد|زول|معجون/.test(n))p+=350000;
 P.push({id:C.pre+(j+1),c:k,n,p:Math.round(p/10000)*10000,h:s})})}

const PAL={honey:['#F6B72B','#E39A12','#C97A0A','#F2C94C','#D98E1F','#B8620A'],ardeh:['#C9964E','#A8743A','#8B5A2B','#6B3E1E','#D2A86A','#7A4A22'],arq:['#CFE8D5','#E6F2C9','#D9EBF2','#F2E6C9','#E3D5F0','#F7DADA'],oil:['#E3C033','#C9A21C','#D4B23A','#B8921A','#E8CE5A','#A8821A'],vin:['#B5483A','#8E2F2F','#C86A4A','#D9A45A','#9B3E52','#CB5A5A']};

const img=p=>PHOTOS.includes(p.id)?`<img loading="lazy" src="images/${p.id}.jpg" alt="${p.n}" onerror="this.parentNode.innerHTML=art('${p.c}',${p.h})">`:art(p.c,p.h);
